name: Bootstrap lockfile & migration

# Trên nhánh tính năng: đồng bộ package-lock.json khi package.json đổi, và sinh migration
# khi schema.prisma lệch so với các migration đã có. Commit lại vào chính nhánh để review.
# Không chạy trên main.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

defaults:
  run:
    # bash -eo pipefail: lỗi ở đầu pipe (ví dụ `script | tee log`) làm bước thất bại
    shell: bash

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor != 'github-actions[bot]'
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: happyclass, POSTGRES_PASSWORD: ci-password, POSTGRES_DB: happyclass_shadow }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U happyclass -d happyclass_shadow"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://happyclass:ci-password@127.0.0.1:5432/happyclass_shadow?schema=public
      SHADOW_DATABASE_URL: postgresql://happyclass:ci-password@127.0.0.1:5432/happyclass_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Đồng bộ lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Sinh migration nếu schema lệch
        run: |
          npm ci --no-audit --no-fund
          cd apps/api
          set +e
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code > /dev/null
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            # Tên phải xếp SAU migration cuối cùng, kể cả khi migration cũ mang mốc thời gian tương lai
            latest="$(ls prisma/migrations | grep -E '^[0-9]{14}_' | sort | tail -n1 | cut -c1-14)"
            now="$(date -u +%Y%m%d%H%M%S)"
            if [ -n "$latest" ] && [ "$now" -le "$latest" ]; then now=$((latest + 1)); fi
            name="${now}_auto"
            mkdir -p "prisma/migrations/$name"
            npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
              --shadow-database-url "$SHADOW_DATABASE_URL" --script > "prisma/migrations/$name/migration.sql"
            echo "::notice title=Migration::Đã sinh prisma/migrations/$name – cần review trước khi merge"
          elif [ "$code" != "0" ]; then
            echo "::error title=Migration::prisma migrate diff lỗi (mã $code)"; exit 1
          fi

      - name: Commit vào nhánh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/api/prisma/migrations
          if git diff --cached --quiet; then echo "Không có gì thay đổi"; exit 0; fi
          git diff --cached --stat
          git commit -m "chore: đồng bộ package-lock.json / sinh migration (CI)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "::notice title=Bootstrap::Đã commit lockfile/migration vào ${GITHUB_REF_NAME}"
