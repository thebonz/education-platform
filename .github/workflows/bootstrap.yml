name: Bootstrap lockfile & migration

# Sinh package-lock.json và migration baseline nếu nhánh chưa có, rồi commit lại vào chính nhánh đó.
# Không chạy trên main; không làm gì nếu cả hai đã tồn tại.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra cần bootstrap không
        id: need
        run: |
          if [ -f package-lock.json ] && [ -d apps/api/prisma/migrations ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.need.outputs.run == 'true'
        with: { node-version: '22' }
      - name: Sinh lockfile và migration
        if: steps.need.outputs.run == 'true'
        run: |
          [ -f package-lock.json ] || npm install --no-audit --no-fund
          cd apps/api
          npx prisma validate
          if [ ! -d prisma/migrations ]; then
            mkdir -p prisma/migrations/20261101000000_init
            npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/20261101000000_init/migration.sql
            printf '# Please do not edit this file manually\n# It should be added in your version-control system (e.g., Git)\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          fi
      - name: Commit vào nhánh
        if: steps.need.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/api/prisma/migrations
          git diff --cached --quiet && exit 0
          git commit -m "chore: thêm package-lock.json và migration baseline (sinh tự động bởi CI)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
