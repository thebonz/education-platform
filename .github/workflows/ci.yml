name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgresql://happyclass:ci-password@127.0.0.1:5432/happyclass_test?schema=public
  SHADOW_DATABASE_URL: postgresql://happyclass:ci-password@127.0.0.1:5432/happyclass_shadow?schema=public
  NEXT_TELEMETRY_DISABLED: '1'

defaults:
  run:
    # bash -eo pipefail: lỗi ở đầu pipe (ví dụ `script | tee log`) làm bước thất bại
    shell: bash

jobs:
  verify:
    name: Build, test, e2e, docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: happyclass
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: happyclass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U happyclass -d happyclass_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Cài dependencies (sinh lockfile nếu chưa có)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::Chưa có package-lock.json – chạy npm install và xuất lockfile làm artifact"
            npm install --no-audit --no-fund
          fi

      - name: Build và test game-core
        run: |
          npm run build:core
          npm run test:core 2>&1 | tee /tmp/core.log
          echo "::notice title=game-core::$(grep -E '^# (pass|fail)' /tmp/core.log | tr '\n' ' ')"

      - name: ESLint
        run: |
          npx eslint . -f json -o /tmp/eslint.json || true
          node .github/scripts/eslint-annotate.mjs /tmp/eslint.json

      - name: Prisma generate + validate
        working-directory: apps/api
        run: npx prisma validate && npx prisma generate

      - name: Migration baseline (sinh nếu chưa có) và kiểm tra lệch schema
        working-directory: apps/api
        run: |
          psql "postgresql://happyclass:ci-password@127.0.0.1:5432/postgres" -c "CREATE DATABASE happyclass_shadow" || true
          if [ ! -d prisma/migrations ]; then
            echo "::warning::Chưa có migration – sinh baseline và xuất làm artifact"
            mkdir -p prisma/migrations/20261101000000_init
            npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script \
              > prisma/migrations/20261101000000_init/migration.sql
            printf '# Please do not edit this file manually\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          fi
          if ! npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code > /tmp/drift.txt 2>&1; then
            body="$(head -c 3000 /tmp/drift.txt | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=Migration lệch schema::${body}"
            exit 1
          fi
          npx prisma migrate deploy

      - name: Typecheck API + Web
        run: npm run typecheck

      - name: Build API
        run: npm run build -w @happyclass/api

      - name: Lỗ hổng thư viện (npm audit, chỉ dependency chạy production)
        run: |
          npm audit --omit=dev --json > /tmp/audit.json 2>/dev/null || true
          node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/audit.json', 'utf8') || '{}');
            const v = (r.metadata && r.metadata.vulnerabilities) || {};
            const fix = (x) => x.fixAvailable === true ? 'có bản vá cùng major' : x.fixAvailable ? 'cần ' + x.fixAvailable.name + '@' + x.fixAvailable.version + (x.fixAvailable.isSemVerMajor ? ' (major)' : '') : 'chưa có bản vá';
            const why = (x) => (x.via || []).map((v) => typeof v === 'string' ? 'qua ' + v : v.title + ' ' + v.range).join('; ');
            const list = Object.values(r.vulnerabilities || {}).filter((x) => ['high', 'critical'].includes(x.severity)).map((x) => x.name + ' (' + x.severity + ', ' + fix(x) + ': ' + why(x) + ')');
            console.log('::notice title=npm audit::critical ' + (v.critical || 0) + ', high ' + (v.high || 0) + ', moderate ' + (v.moderate || 0) + ', low ' + (v.low || 0));
            for (const l of list) console.log('::warning title=npm audit::' + l.slice(0, 900));
            process.exit(v.critical ? 1 : 0);
          "

      - name: Test API (unit + e2e với PostgreSQL thật)
        run: |
          set +e
          npm test -w @happyclass/api -- --ci --json --outputFile=/tmp/jest.json
          code=$?
          node .github/scripts/jest-annotate.mjs /tmp/jest.json
          exit $code

      - name: Build Web
        run: npm run build -w @happyclass/web

      - name: Khởi động API + Web cho E2E
        env:
          SITE_ENGLISH_URL: http://english.happyclass.test:3100
          SITE_VIETNAMESE_URL: http://vietnamese.happyclass.test:3100
          SITE_ADMIN_URL: http://admin.happyclass.test:3100
          COOKIE_DOMAIN: .happyclass.test
          MAIL_TRANSPORT: log
          TRUST_PROXY_HOPS: '1'
          AUTH_RATE_LIMIT_PER_MINUTE: '50'
          # Thanh toán chế độ thử nghiệm với số tài khoản GIẢ
          PAYMENT_MODE: sandbox
          PAYMENT_BANK_ACCOUNT: '100000000001'
          PAYMENT_BANK_ACCOUNT_NAME: NGUYEN VAN TEST
        run: |
          ADMIN_PW="$(openssl rand -base64 24)"
          echo "::add-mask::$ADMIN_PW"
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PW" >> "$GITHUB_ENV"
          export SEPAY_WEBHOOK_KEY="$(openssl rand -hex 24)"
          echo "::add-mask::$SEPAY_WEBHOOK_KEY"
          echo "E2E_SEPAY_KEY=$SEPAY_WEBHOOK_KEY" >> "$GITHUB_ENV"
          node apps/api/dist/cli/seed.js
          printf '%s' "$ADMIN_PW" | node apps/api/dist/cli/create-admin.js admin@happyclass.test "CI Admin"
          (cd apps/api && PORT=4000 nohup node dist/main.js > /tmp/api.log 2>&1 &)
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          (PORT=3100 HOSTNAME=0.0.0.0 API_INTERNAL_URL=http://127.0.0.1:4000/api \
            nohup node apps/web/.next/standalone/apps/web/server.js > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4000/api/health >/dev/null && curl -fsS http://127.0.0.1:3100/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/api/health
          curl -fsS -o /dev/null -w 'web %{http_code}\n' -H 'Host: vietnamese.happyclass.test:3100' http://127.0.0.1:3100/games

      - name: E2E Playwright (đăng nhập dùng chung subdomain, admin, game)
        working-directory: apps/web
        env:
          E2E_ADMIN_EMAIL: admin@happyclass.test
        run: |
          # Test gọi API trực tiếp từ Node (không qua Chromium) cũng cần phân giải tên miền thử
          echo "127.0.0.1 english.happyclass.test vietnamese.happyclass.test admin.happyclass.test" | sudo tee -a /etc/hosts
          npx playwright install --with-deps chromium
          PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/pw.json npx playwright test --reporter=github,list,json
      - name: Tóm tắt Playwright
        if: always()
        run: |
          [ -f /tmp/pw.json ] && node -e "const s=require('/tmp/pw.json').stats; console.log('::notice title=Playwright::expected(pass) ' + s.expected + ', unexpected(fail) ' + s.unexpected + ', flaky ' + s.flaky + ', skipped ' + s.skipped)" || true

      - name: Log API/Web khi lỗi (xuất dạng annotation)
        if: failure()
        run: |
          for f in /tmp/api.log /tmp/web.log; do
            [ -f "$f" ] || continue
            body="$(tail -n 60 "$f" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::warning title=$(basename "$f")::${body}"
          done

      - name: Build Docker images
        run: |
          annotate() { body="$(tail -n 40 "$2" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"; echo "::error title=$1::${body}"; }
          check() { name="$1"; shift; if ! "$@" > "/tmp/$name.log" 2>&1; then annotate "$name" "/tmp/$name.log"; exit 1; fi; }
          export DOCKER_BUILDKIT=1 BUILDKIT_PROGRESS=plain
          check docker-build-api docker build -f apps/api/Dockerfile -t happyclass/api:ci .
          check docker-build-web docker build -f apps/web/Dockerfile -t happyclass/web:ci .
          check api-user sh -c 'docker run --rm happyclass/api:ci id -un | grep -qx node'
          check web-user sh -c 'docker run --rm happyclass/web:ci id -un | grep -qx node'
          check api-prisma docker run --rm --entrypoint /app/node_modules/.bin/prisma happyclass/api:ci --version
          docker image ls happyclass/*

      - name: Kiểm tra docker-compose.yml
        run: cp .env.example .env && docker compose config --quiet && rm .env

      - name: Xuất lockfile và migration (nếu vừa sinh)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-files
          path: |
            package-lock.json
            apps/api/prisma/migrations
          if-no-files-found: ignore

      - name: Báo cáo Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  deploy-smoke:
    name: Chạy thử ops/deploy-test.sh như trên máy chủ
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HC_DATA_DIR: /tmp/hc-data
    steps:
      - uses: actions/checkout@v4

      - name: Triển khai lần 1 (máy mới)
        run: sudo --preserve-env=HC_DATA_DIR bash ops/deploy-test.sh 2>&1 | tee /tmp/deploy1.log

      - name: Tạo Super Admin không tương tác và đăng nhập qua Web
        run: |
          printf '%s' 'Ci-Admin-Password-2026' | sudo ADMIN_EMAIL=admin@happyclass.test ADMIN_NAME="CI Admin" bash ops/create-admin.sh
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' -c /tmp/cookies.txt \
            -H 'Origin: http://localhost:3100' -H 'Content-Type: application/json' \
            -d '{"email":"admin@happyclass.test","password":"Ci-Admin-Password-2026"}' http://127.0.0.1:3100/api/auth/login)
          test "$code" = "200" || { echo "::error title=login::HTTP $code $(cat /tmp/login.json)"; exit 1; }
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3100/api/admin/stats | grep -q '"publishedGames":6'
          echo "::notice title=Deploy smoke::Đăng nhập Super Admin qua Web và đọc /api/admin/stats thành công"

      - name: Tải ảnh lên thư viện media qua Web (container API ghi được vào HC_DATA_DIR/media/assets)
        run: |
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=' | base64 -d > /tmp/dot.png
          code=$(curl -s -o /tmp/upload.json -w '%{http_code}' -b /tmp/cookies.txt -H 'Origin: http://localhost:3100' \
            -F 'file=@/tmp/dot.png;filename=chấm.png' -F 'alt=chấm đen' http://127.0.0.1:3100/api/admin/media)
          test "$code" = "201" || { echo "::error title=media::HTTP $code $(cat /tmp/upload.json)"; exit 1; }
          url=$(node -p "require('/tmp/upload.json').url")
          curl -fsS -D /tmp/h.txt -o /tmp/got.png "http://127.0.0.1:3100$url"
          cmp /tmp/dot.png /tmp/got.png
          grep -qi '^x-content-type-options: nosniff' /tmp/h.txt
          test "$(sudo find "$HC_DATA_DIR/media/assets" -type f -name '*.png' | wc -l)" = 1
          echo "::notice title=Deploy smoke::Tải ảnh lên qua Web, file nằm ở HC_DATA_DIR/media/assets và tải về đúng nội dung"

      - name: Đọc tiếng Việt giọng Bắc (dịch vụ tts Piper) qua Web, lưu đệm, không mở cổng
        run: |
          trap 'echo "::error title=tts-step::lỗi ở dòng $LINENO: $BASH_COMMAND"' ERR
          mkdir -p /tmp/giong-doc
          q() { node -p "encodeURIComponent(process.argv[1])" "$1"; }
          i=0
          for s in "Con mèo trèo cây cau" "Bé đi học" "Nghe và chọn dấu thanh đúng" "Thước kẻ, bút chì, quyển vở"; do
            i=$((i+1)); t0=$(date +%s%N)
            code=$(curl -s -o /tmp/giong-doc/$i.wav -w '%{http_code}' "http://127.0.0.1:3100/api/tts?lang=vi&text=$(q "$s")")
            if [ "$code" != 200 ]; then
              echo "::error title=tts::HTTP $code cho '$s': $(head -c 300 /tmp/giong-doc/$i.wav)"
              echo "::error title=tts-logs::$(sudo docker compose logs --tail 30 tts api 2>&1 | tail -n 30 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
              exit 1
            fi
            test "$(head -c 4 /tmp/giong-doc/$i.wav)" = RIFF
            size=$(stat -c %s /tmp/giong-doc/$i.wav); ms=$(( ($(date +%s%N) - t0) / 1000000 ))
            test "$size" -gt 20000
            echo "::notice title=TTS::'$s' → $(( (size - 44) * 1000 / 44100 )) ms âm thanh, tạo trong ${ms} ms"
          done
          # Lần hai lấy từ bộ nhớ đệm: cùng nội dung, nhanh
          t0=$(date +%s%N); curl -fsS -o /tmp/again.wav "http://127.0.0.1:3100/api/tts?lang=vi&text=$(q "Bé đi học")"; ms=$(( ($(date +%s%N) - t0) / 1000000 ))
          cmp /tmp/giong-doc/2.wav /tmp/again.wav
          # ≥ 4: API còn tự tạo sẵn âm thanh cho các game tiếng Việt ở chế độ nền
          n=$(sudo find "$HC_DATA_DIR/media/tts" -name '*.wav' | wc -l); test "$n" -ge 4
          # Không publish cổng nào ra máy chủ (docker port in rỗng)
          test -z "$(sudo docker port "$(sudo docker compose ps -q tts)")"
          test "$(sudo docker compose ps tts --format '{{.Health}}')" = healthy || sudo docker compose ps tts
          echo "::notice title=TTS::Lần hai (lưu đệm) ${ms} ms; $n file trong HC_DATA_DIR/media/tts; dịch vụ tts không mở cổng ra máy chủ"

      - name: Lưu file giọng đọc mẫu để nghe thử
        uses: actions/upload-artifact@v4
        with:
          name: giong-doc-mau
          path: /tmp/giong-doc/*.wav
          retention-days: 14

      - name: Thanh toán sandbox – tạo đơn, webhook SePay đi qua Web, cấp gói (số tài khoản GIẢ)
        run: |
          sudo PAYMENT_BANK_ACCOUNT=100000000001 PAYMENT_BANK_ACCOUNT_NAME="nguyen van test" bash ops/configure-payments.sh </dev/null > /tmp/pay.log 2>&1 || { cat /tmp/pay.log; exit 1; }
          key="$(sudo grep '^SEPAY_WEBHOOK_KEY=' .env | cut -d= -f2-)"; echo "::add-mask::$key"
          test "${#key}" -ge 24
          sudo grep -q '^PAYMENT_BANK_ACCOUNT_NAME=NGUYEN VAN TEST$' .env
          W=http://127.0.0.1:3100
          plan="$(curl -fsS "$W/api/billing/plans?product=english" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);if(!r.paymentsEnabled)process.exit(1);console.log(r.plans.find(p=>p.code==='english-month').id)})")"
          code="$(curl -fsS -b /tmp/cookies.txt -H 'Origin: http://localhost:3100' -H 'Content-Type: application/json' -d "{\"planId\":\"$plan\"}" "$W/api/billing/orders" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).code")"
          curl -fsS -b /tmp/cookies.txt "$W/api/billing/orders/$code" | grep -q '"qrPayload":"000201'
          # Sai khóa → 401; đúng khóa (qua proxy của Web) → khớp đơn
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Apikey sai' -H 'Content-Type: application/json' -d '{}' "$W/api/webhooks/sepay")" = 401
          body="{\"id\":424242,\"gateway\":\"VietinBank\",\"transactionDate\":\"2026-11-08 10:00:00\",\"accountNumber\":\"100000000001\",\"content\":\"CT $code\",\"transferType\":\"in\",\"transferAmount\":55000}"
          curl -fsS -X POST -H "Authorization: Apikey $key" -H 'Content-Type: application/json' -d "$body" "$W/api/webhooks/sepay" | grep -q '"result":"matched"'
          curl -fsS -b /tmp/cookies.txt "$W/api/billing/orders/$code" | grep -q '"status":"PAID"'
          curl -fsS -b /tmp/cookies.txt "$W/api/billing/me" | grep -q '"slug":"english"'
          echo "::notice title=Deploy smoke::Thanh toán sandbox qua Docker: tạo đơn, VietQR, webhook SePay qua proxy Web, cấp gói"

      - name: Tạo tài khoản giáo viên duyệt nội dung bằng script
        run: |
          printf '%s' 'Ci-Reviewer-Password-2026' | sudo ADMIN_EMAIL=reviewer@happyclass.test ADMIN_NAME="Cô Giáo CI" bash ops/create-admin.sh --role content_reviewer
          curl -fsS -c /tmp/rev.txt -o /dev/null -H 'Origin: http://localhost:3100' -H 'Content-Type: application/json' \
            -d '{"email":"reviewer@happyclass.test","password":"Ci-Reviewer-Password-2026"}' http://127.0.0.1:3100/api/auth/login
          curl -fsS -b /tmp/rev.txt http://127.0.0.1:3100/api/auth/me | grep -q '"games.review"'
          # Giáo viên duyệt xem được nội dung nhưng không quản lý người dùng
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/rev.txt 'http://127.0.0.1:3100/api/admin/games?review=PENDING')" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/rev.txt http://127.0.0.1:3100/api/admin/users)" = 403
          # Vai trò sai bị từ chối
          if printf '%s' 'Ci-Reviewer-Password-2026' | sudo ADMIN_EMAIL=x@happyclass.test bash ops/create-admin.sh --role member; then exit 1; fi
          echo "::notice title=Deploy smoke::Tạo tài khoản content_reviewer bằng ops/create-admin.sh --role, đăng nhập và đúng quyền"

      - name: Sao lưu database
        run: |
          sudo --preserve-env=HC_DATA_DIR bash ops/backup-db.sh ci
          sudo ls -l /tmp/hc-data/backups/
          sudo sh -c 'cd /tmp/hc-data/backups && sha256sum -c *.sha256'

      - name: Sao lưu mã hoá ra kho S3 (rclone serve s3 thay cho R2/B2), diễn tập khôi phục, lịch systemd
        env:
          BACKUP_DOCKER_NETWORK: host
        run: |
          trap 'echo "::error title=backup-step::lỗi ở dòng $LINENO: $BASH_COMMAND"; for f in /tmp/bk*.log /tmp/restore.log; do [ -f "$f" ] && echo "::warning title=$(basename $f)::$(tail -n 25 "$f" | sed -e "s/%/%25/g" | awk "BEGIN{ORS=\"%0A\"} {print}")"; done' ERR
          # Kho S3 thử nghiệm (chỉ dùng trong CI): rclone serve s3 trên thư mục trong container
          img=""; for c in rclone/rclone:1.68.2 rclone/rclone:1.69.1 rclone/rclone:latest; do
            if sudo docker pull -q "$c" > /tmp/pull.log 2>&1; then img="$c"; break; fi
            echo "::warning title=Backup::Không tải được $c: $(tail -n1 /tmp/pull.log)"
          done
          test -n "$img"
          echo "::notice title=Backup::Kho S3 thử nghiệm: $img"
          sudo docker run -d --name hc-minio -p 127.0.0.1:9000:9000 "$img" serve s3 --addr :9000 \
            --auth-key ci-backup,ci-backup-secret-2026 /data > /tmp/s3run.log 2>&1 \
            || { echo "::error title=Backup::Không chạy được kho S3: $(tail -n2 /tmp/s3run.log | tr '\n' ' ')"; exit 1; }
          sudo docker exec hc-minio mkdir -p /data/happyclass-ci 2>/dev/null || true
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          keep="HC_DATA_DIR,BACKUP_DOCKER_NETWORK"
          conf() { sudo --preserve-env=$keep BACKUP_PROVIDER=s3 BACKUP_ENDPOINT=http://127.0.0.1:9000 BACKUP_BUCKET=happyclass-ci \
            BACKUP_ACCESS_KEY_ID=ci-backup BACKUP_SECRET_ACCESS_KEY=ci-backup-secret-2026 bash ops/configure-backup.sh </dev/null; }
          fail() { echo "::error title=$1::$(tail -n 15 "$2" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"; exit 1; }
          conf > /tmp/bk-conf.log 2>&1 || fail configure-backup /tmp/bk-conf.log
          test "$(sudo stat -c %a "$HC_DATA_DIR/backup/backup.env")" = 600
          pw1="$(sudo grep '^RESTIC_PASSWORD=' "$HC_DATA_DIR/backup/backup.env" | cut -d= -f2-)"; echo "::add-mask::$pw1"
          # Chạy lại cấu hình: giữ nguyên mật khẩu mã hoá, kho vẫn mở được
          conf > /tmp/bk-conf2.log 2>&1 || fail configure-backup-2 /tmp/bk-conf2.log
          grep -q 'mở được bằng mật khẩu hiện tại' /tmp/bk-conf2.log
          test "$(sudo grep '^RESTIC_PASSWORD=' "$HC_DATA_DIR/backup/backup.env" | cut -d= -f2-)" = "$pw1"
          sudo --preserve-env=$keep bash ops/backup-offsite.sh --check 2>&1 | tee /tmp/bk1.log
          grep -q 'Kho toàn vẹn' /tmp/bk1.log
          sudo test -f "$HC_DATA_DIR/backup/last-success"
          sudo --preserve-env=$keep bash ops/backup-offsite.sh > /tmp/bk2.log 2>&1 || fail backup-offsite-2 /tmp/bk2.log
          sudo --preserve-env=$keep bash ops/configure-backup.sh --check | tee /tmp/bk-snap.log
          grep -q 'happyclass' /tmp/bk-snap.log
          sudo --preserve-env=$keep bash ops/restore-test.sh 2>&1 | tee /tmp/restore.log
          grep -q 'Diễn tập khôi phục thành công' /tmp/restore.log
          grep -q '1 file media, tất cả khớp SHA-256' /tmp/restore.log
          # Trang Admin → Tình trạng hệ thống thấy được lần sao lưu và diễn tập vừa xong
          code=$(curl -sS -o /tmp/status.json -w '%{http_code}' -b /tmp/cookies.txt http://127.0.0.1:3100/api/admin/system/status)
          if [ "$code" != 200 ]; then
            echo "::error title=Status::HTTP $code $(head -c 400 /tmp/status.json)"
            echo "::error title=Status-api-log::$(sudo docker compose logs --tail 15 api 2>&1 | grep -iv 'RouterExplorer\|RoutesResolver' | tail -n 8 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            exit 1
          fi
          node -e "const s=require('/tmp/status.json');const g=(k)=>s.checks.find((c)=>c.key===k);
            const bad=['backup','restore','database','offline'].filter((k)=>g(k).level!=='ok');
            if(g('tts').level==='error')bad.push('tts');if(!s.version.commit)bad.push('commit');
            console.log('::notice title=Status::'+s.checks.map((c)=>c.key+'='+c.level).join(', ')+' · commit '+s.version.commit);
            if(bad.length){console.log('::error title=Status::'+bad.join(', ')+' '+JSON.stringify(s.checks));process.exit(1)}"
          # Dọn sạch: không còn container hay thư mục diễn tập
          test -z "$(sudo docker ps -aq --filter label=happyclass.restore-test=1)"
          test -z "$(sudo find "$HC_DATA_DIR/backup" -maxdepth 1 -name 'restore-test-*')"
          # Dữ liệu trên kho đã mã hoá: không thấy email hay mật khẩu database ở dạng rõ
          sudo docker cp hc-minio:/data /tmp/minio-data
          dbpw="$(sudo grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)"; echo "::add-mask::$dbpw"
          ! sudo grep -rqa 'admin@happyclass.test' /tmp/minio-data
          ! sudo grep -rqaF "$dbpw" /tmp/minio-data
          # Lịch systemd: cài, liệt kê, gỡ
          sudo --preserve-env=HC_DATA_DIR bash ops/install-backup-timer.sh
          systemctl list-timers 'happyclass-*' --no-pager | grep -q happyclass-backup.timer
          sudo bash ops/install-backup-timer.sh --remove
          test ! -f /etc/systemd/system/happyclass-backup.timer
          sudo docker rm -f hc-minio > /dev/null
          echo "::notice title=Backup::Sao lưu restic lên S3, kiểm tra toàn vẹn, diễn tập khôi phục (DB + media) khớp; dữ liệu trên kho đã mã hoá; lịch systemd cài/gỡ được"

      - name: Triển khai lần 2 (cập nhật, phải idempotent và tự sao lưu trước migrate)
        run: |
          sudo --preserve-env=HC_DATA_DIR bash ops/deploy-test.sh 2>&1 | tee /tmp/deploy2.log
          grep -q 'Sao lưu database trước khi áp migration' /tmp/deploy2.log
          test "$(sudo sh -c 'ls /tmp/hc-data/backups/*.dump | wc -l')" -ge 2
          # Lần 2 không tạo/cập nhật game nào; số game khớp số gói nội dung trong mã nguồn
          grep -q 'game mới 0, cập nhật 0' /tmp/deploy2.log
          games="$(sudo docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM games"')"
          grep -q "giữ nguyên ${games}\." /tmp/deploy2.log
          echo "::notice title=Deploy smoke::Triển khai lần 2 idempotent; vẫn ${games} game; có bản sao lưu trước migrate"

      - name: Container chạy user không phải root, cổng chỉ bind 127.0.0.1, Postgres không publish
        run: |
          fail=0
          for s in api web; do
            u="$(sudo docker compose exec -T "$s" id -un | tr -d '\r')"
            echo "::notice title=user-$s::$u"; [ "$u" = node ] || fail=1
          done
          for s in postgres api web; do
            b="$(sudo docker inspect -f '{{json .HostConfig.PortBindings}}' "$(sudo docker compose ps -q "$s")")"
            echo "::notice title=ports-$s::$b"
            case "$s" in
              postgres) [ "$b" = "{}" ] || [ "$b" = "null" ] || fail=1 ;;
              *) echo "$b" | grep -q '"HostIp":"127.0.0.1"' || fail=1; ! echo "$b" | grep -q '"HostIp":""' || fail=1 ;;
            esac
          done
          exit $fail

      - name: Chế độ tên miền (ops/enable-domain.sh --no-tunnel) và image cloudflared
        run: |
          sudo docker pull -q cloudflare/cloudflared:2026.8.1
          sudo docker run --rm cloudflare/cloudflared:2026.8.1 --version
          sudo --preserve-env=HC_DATA_DIR bash ops/enable-domain.sh --no-tunnel 2>&1 | tee /tmp/domain.log
          sudo docker compose --profile tunnel config --quiet
          # Đăng nhập qua tên miền: cookie Secure, Domain=.happyclass.asia; dùng được ở subdomain khác
          curl -s -D /tmp/h.txt -o /dev/null -H 'Host: english.happyclass.asia' -H 'Origin: https://english.happyclass.asia' \
            -H 'Content-Type: application/json' -d '{"email":"admin@happyclass.test","password":"Ci-Admin-Password-2026"}' \
            http://127.0.0.1:3100/api/auth/login
          grep -i '^set-cookie: hc_session=' /tmp/h.txt | tee /tmp/cookie.txt
          grep -qi 'Domain=\.\?happyclass\.asia' /tmp/cookie.txt
          grep -qi 'Secure' /tmp/cookie.txt
          grep -qi 'HttpOnly' /tmp/cookie.txt
          token="$(sed -E 's/^[Ss]et-[Cc]ookie: hc_session=([^;]+).*/\1/' /tmp/cookie.txt | tr -d '\r')"
          curl -fsS -H 'Host: tiengviet.happyclass.asia' -H "Cookie: hc_session=$token" http://127.0.0.1:3100/api/auth/me | grep -q admin@happyclass.test
          # Origin cũ (localhost) bị từ chối sau khi chuyển sang tên miền
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: http://localhost:3100' -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3100/api/auth/login)
          test "$code" = 403
          # Link trên trang chung trỏ đúng subdomain
          curl -fsS -H 'Host: happyclass.asia' http://127.0.0.1:3100/ | grep -q 'https://tiengviet.happyclass.asia'
          curl -fsS -H 'Host: tiengviet.happyclass.asia' http://127.0.0.1:3100/robots.txt | grep -q 'Sitemap: https://tiengviet.happyclass.asia/sitemap.xml'
          echo "::notice title=Domain mode::Cookie .happyclass.asia (Secure, HttpOnly) dùng chung english↔tiengviet; origin localhost bị chặn; cloudflared 2026.8.1 có sẵn"

      - name: Gỡ môi trường, dữ liệu vẫn còn
        run: |
          sudo docker compose down
          sudo test -f /tmp/hc-data/database/postgres/PG_VERSION
          echo "::notice title=Deploy smoke::docker compose down giữ nguyên dữ liệu trên HC_DATA_DIR"

      - name: Log khi lỗi (annotation)
        if: failure()
        run: |
          for f in /tmp/deploy1.log /tmp/deploy2.log; do
            [ -f "$f" ] || continue
            body="$(tail -n 50 "$f" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"; echo "::error title=$(basename $f)::${body}"
          done
          body="$(sudo docker compose logs --tail 40 2>&1 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"; echo "::error title=compose-logs::${body}"

  upgrade-smoke:
    name: Nâng cấp từ bản đang chạy (main) lên bản mới, giữ dữ liệu
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HC_DATA_DIR: /tmp/hc-data
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Cài bản main (giống máy chủ hiện tại)
        run: |
          git checkout -q "origin/${{ github.base_ref }}"
          echo "::notice title=Upgrade smoke::Bản gốc: $(git rev-parse --short HEAD)"
          sudo --preserve-env=HC_DATA_DIR bash ops/deploy-test.sh 2>&1 | tee /tmp/up1.log
          printf '%s' 'Ci-Admin-Password-2026' | sudo ADMIN_EMAIL=admin@happyclass.test ADMIN_NAME="CI Admin" bash ops/create-admin.sh
          curl -fsS -c /tmp/c.txt -H 'Origin: http://localhost:3100' -H 'Content-Type: application/json' \
            -d '{"email":"admin@happyclass.test","password":"Ci-Admin-Password-2026"}' http://127.0.0.1:3100/api/auth/login > /dev/null
          q() { sudo docker compose exec -T postgres sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tAc \"$1\""; }
          echo "GAMES_BEFORE=$(q 'SELECT count(*) FROM games')" >> "$GITHUB_ENV"
          echo "VERSIONS_BEFORE=$(q 'SELECT count(*) FROM game_versions')" >> "$GITHUB_ENV"

      - name: Nâng cấp lên commit của PR
        run: |
          sudo chown -R "$(id -u)" .git
          git checkout -q "${{ github.event.pull_request.head.sha }}"
          sudo --preserve-env=HC_DATA_DIR bash ops/deploy-test.sh 2>&1 | tee /tmp/up2.log
          grep -q 'Sao lưu database trước khi áp migration' /tmp/up2.log

      - name: Dữ liệu cũ còn nguyên, nội dung mới đã phát hành
        run: |
          q() { sudo docker compose exec -T postgres sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tAc \"$1\""; }
          test "$(q "SELECT count(*) FROM users WHERE email='admin@happyclass.test'")" = 1
          test "$(q "SELECT count(*) FROM user_sessions WHERE revoked_at IS NULL")" -ge 1
          games="$(q "SELECT count(*) FROM games")"; versions="$(q "SELECT count(*) FROM game_versions")"
          # Không mất game hay phiên bản nào; game mới (nếu có) đã được thêm
          test "$games" -ge "$GAMES_BEFORE"
          test "$versions" -ge "$VERSIONS_BEFORE"
          # Mỗi game có đúng một phiên bản đang phát hành và đã gắn cấp độ
          test "$(q "SELECT count(*) FROM games g WHERE (SELECT count(*) FROM game_versions v WHERE v.game_id = g.id AND v.is_published) <> 1")" = 0
          test "$(q "SELECT count(*) FROM games WHERE level_id IS NULL")" = 0
          # Phiên đăng nhập tạo ở bản cũ vẫn dùng được sau nâng cấp
          curl -fsS -b /tmp/c.txt http://127.0.0.1:3100/api/auth/me | grep -q admin@happyclass.test
          curl -fsS http://127.0.0.1:3100/api/catalog/products/english/games/team-quiz/play | grep -q '"mode":"teams"'
          echo "::notice title=Upgrade smoke::Nâng cấp giữ tài khoản và phiên; game $GAMES_BEFORE → $games, phiên bản $VERSIONS_BEFORE → $versions"

      - name: Log khi lỗi (annotation)
        if: failure()
        run: |
          for f in /tmp/up1.log /tmp/up2.log; do
            [ -f "$f" ] || continue
            body="$(tail -n 50 "$f" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"; echo "::error title=$(basename $f)::${body}"
          done
